<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Logo Quiz Admin</title>
  <link rel="stylesheet" href="style.css?v=20260522-new-packs" />
</head>
<body class="admin-body">
  <main class="admin-shell">
    <section class="admin-card admin-login" id="admin-login">
      <p class="admin-kicker">Logo Quiz Admin</p>
      <h1>Analytics</h1>
      <p class="admin-muted">Enter the admin password to view private play stats.</p>
      <label for="admin-password">Password</label>
      <div class="admin-login-row">
        <input id="admin-password" type="password" autocomplete="current-password" />
        <button class="btn btn-primary" id="btn-admin-login">View admin</button>
      </div>
      <p class="admin-error" id="admin-error" aria-live="polite"></p>
    </section>

    <section class="admin-dashboard hidden" id="admin-dashboard">
      <div class="admin-header">
        <div>
          <p class="admin-kicker">Logo Quiz Admin</p>
          <h1>Play Analytics</h1>
          <p class="admin-muted" id="admin-generated"></p>
        </div>
        <button class="btn btn-ghost btn-sm" id="btn-admin-refresh">Refresh</button>
      </div>

      <div class="admin-stats" id="admin-stats"></div>

      <div class="admin-controls">
        <label>
          Pack
          <select id="admin-pack-filter">
            <option value="all">All packs</option>
            <option value="brands">Mix Brands</option>
            <option value="travel">Travel &amp; Adventure</option>
            <option value="tech-car">Tech &amp; Car</option>
            <option value="fashion-finance">Fashion &amp; Finance</option>
          </select>
        </label>
        <label>
          Date range
          <select id="admin-date-filter">
            <option value="all" selected>All time</option>
            <option value="today">Today</option>
            <option value="7d">Last 7 days</option>
            <option value="30d">Last 30 days</option>
          </select>
        </label>
        <label>
          Search
          <input id="admin-search" type="search" placeholder="Player or device ID" />
        </label>
        <label>
          Rows
          <select id="admin-page-size">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
      </div>

      <nav class="admin-tabs" aria-label="Admin analytics sections">
        <button id="admin-tab-overview" class="admin-tab is-active" type="button" data-tab="overview">Overview</button>
        <button id="admin-tab-recent" class="admin-tab" type="button" data-tab="recentPlays">Recent Plays</button>
        <button id="admin-tab-players" class="admin-tab" type="button" data-tab="playerStats">Players &amp; Devices</button>
        <button id="admin-tab-leaderboard" class="admin-tab" type="button" data-tab="leaderboard">Leaderboard</button>
        <button id="admin-tab-categories" class="admin-tab" type="button" data-tab="categoryPerformance">Categories</button>
        <button id="admin-tab-questions" class="admin-tab" type="button" data-tab="questionInsights">Question Insights</button>
        <button id="admin-tab-logo-health" class="admin-tab" type="button" data-tab="logoHealth">Logo Health</button>
      </nav>

      <section class="admin-card admin-panel" id="admin-panel">
        <div class="admin-panel-header">
          <div>
            <h2 id="admin-panel-title">Overview</h2>
            <p class="admin-muted" id="admin-panel-summary"></p>
          </div>
          <div class="admin-pagination" id="admin-pagination"></div>
        </div>
        <div id="admin-table" class="admin-table-wrap"></div>
      </section>
    </section>
  </main>
  <script type="module" src="src/admin.js?v=20260522-admin-date-filter"></script>
</body>
</html>
